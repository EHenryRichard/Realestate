services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sureboy_realty}
      POSTGRES_USER: ${POSTGRES_USER:-app_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_before_deploy}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    image: ghcr.io/${GHCR_OWNER:-owner}/sureboy-api:${IMAGE_TAG:-latest}
    build:
      context: ./api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SERVER_HOST: 0.0.0.0
      SERVER_PORT: 8080
      ADMIN_BASE_PATH: ${ADMIN_BASE_PATH:-/control-panel}
      ADMIN_API_PATH: ${ADMIN_API_PATH:-/core-portal}
      DATABASE_URL: postgres://${POSTGRES_USER:-app_user}:${POSTGRES_PASSWORD:-change_me_before_deploy}@postgres:5432/${POSTGRES_DB:-sureboy_realty}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in your root .env file}
      JWT_ACCESS_EXPIRES_IN: ${JWT_ACCESS_EXPIRES_IN:-15m}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-7d}
      REFRESH_COOKIE_SECURE: ${REFRESH_COOKIE_SECURE:-false}
      FRONTEND_URL: ${PUBLIC_ORIGIN:-http://localhost}
      UPLOAD_DIR: /app/uploads
      FFMPEG_PATH: /usr/bin/ffmpeg
      FFPROBE_PATH: /usr/bin/ffprobe
      RATE_LIMIT_WINDOW_SECONDS: ${RATE_LIMIT_WINDOW_SECONDS:-60}
      RATE_LIMIT_MAX_REQUESTS: ${RATE_LIMIT_MAX_REQUESTS:-60}
      VIDEO_MAX_WIDTH: ${VIDEO_MAX_WIDTH:-1280}
      VIDEO_PRESET: ${VIDEO_PRESET:-veryfast}
      VIDEO_TARGET_BITRATE: ${VIDEO_TARGET_BITRATE:-2200k}
      VIDEO_MAX_BITRATE: ${VIDEO_MAX_BITRATE:-3000k}
      VIDEO_BUFFER_SIZE: ${VIDEO_BUFFER_SIZE:-6000k}
      VIDEO_AUDIO_BITRATE: ${VIDEO_AUDIO_BITRATE:-96k}
      VIDEO_REMUX_MAX_WIDTH: ${VIDEO_REMUX_MAX_WIDTH:-1920}
      VIDEO_REMUX_MAX_BITRATE: ${VIDEO_REMUX_MAX_BITRATE:-12000000}
      VIDEO_MAX_CONCURRENT_ENCODES: ${VIDEO_MAX_CONCURRENT_ENCODES:-1}
      MEDIA_URL_SECRET: ${MEDIA_URL_SECRET:-${JWT_SECRET}}
      MEDIA_URL_TTL_SECONDS: ${MEDIA_URL_TTL_SECONDS:-3600}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-}
      RUST_LOG: ${RUST_LOG:-info}
    volumes:
      - uploads_data:/app/uploads
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10

  frontend:
    image: ghcr.io/${GHCR_OWNER:-owner}/sureboy-frontend:${IMAGE_TAG:-latest}
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: /api
        VITE_USE_API: "true"
        VITE_API_TIMEOUT: ${VITE_API_TIMEOUT:-30000}
        VITE_ADMIN_BASE_PATH: ${ADMIN_BASE_PATH:-/control-panel}
        VITE_ADMIN_API_BASE_PATH: ${ADMIN_API_PATH:-/core-portal}
        VITE_VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${HTTP_PORT:-80}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10

  postgres-backup:
    image: prodrigestivill/postgres-backup-local:16
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_DB: ${POSTGRES_DB:-sureboy_realty}
      POSTGRES_USER: ${POSTGRES_USER:-app_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_before_deploy}
      SCHEDULE: ${POSTGRES_BACKUP_SCHEDULE:-@daily}
      BACKUP_KEEP_DAYS: ${POSTGRES_BACKUP_KEEP_DAYS:-7}
      BACKUP_KEEP_WEEKS: ${POSTGRES_BACKUP_KEEP_WEEKS:-4}
      BACKUP_KEEP_MONTHS: ${POSTGRES_BACKUP_KEEP_MONTHS:-6}
    volumes:
      - postgres_backups:/backups

volumes:
  postgres_data:
  postgres_backups:                                                                                                                      
  uploads_data:
