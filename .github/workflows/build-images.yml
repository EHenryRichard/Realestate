name: Build and push images

# Builds the API and frontend Docker images on every push to main and pushes
# them to GitHub Container Registry (GHCR). The VPS then just pulls them, so the
# heavy Rust build never runs on the production server.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Lowercase owner for image names
        run: echo "OWNER_LC=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: ./api
          push: true
          tags: |
            ghcr.io/${{ env.OWNER_LC }}/sureboy-api:latest
            ghcr.io/${{ env.OWNER_LC }}/sureboy-api:${{ github.sha }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          build-args: |
            VITE_API_BASE_URL=/api
            VITE_USE_API=true
            VITE_API_TIMEOUT=30000
            VITE_ADMIN_BASE_PATH=${{ secrets.VITE_ADMIN_BASE_PATH }}
            VITE_ADMIN_API_BASE_PATH=${{ secrets.VITE_ADMIN_API_BASE_PATH }}
            VITE_VAPID_PUBLIC_KEY=${{ secrets.VITE_VAPID_PUBLIC_KEY }}
          tags: |
            ghcr.io/${{ env.OWNER_LC }}/sureboy-frontend:latest
            ghcr.io/${{ env.OWNER_LC }}/sureboy-frontend:${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
