name: CI build check

# Validates that both images still build, without pushing anything. Runs on pull
# requests and on pushes to non-main branches (main is already covered by
# build-images.yml, which builds and pushes to GHCR).

on:
  pull_request:
    branches: [main]
  push:
    branches-ignore: [main]
  workflow_dispatch: {}

jobs:
  build-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API image (no push)
        uses: docker/build-push-action@v6
        with:
          context: ./api
          push: false
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Build frontend image (no push)
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: false
          build-args: |
            VITE_API_BASE_URL=/api
            VITE_USE_API=true
            VITE_API_TIMEOUT=30000
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
